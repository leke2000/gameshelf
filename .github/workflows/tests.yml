name: tests

# Two jobs rather than a matrix: `shell:` does not accept `${{ matrix.shell }}`
# ("Unrecognized named-value: 'matrix'"), and the whole point of this workflow is to
# know the suite passes on both PowerShell 5.1 and 7 - git does not follow the
# junctions a shelf is made of, so the shelf itself is not tested here, only the
# tool.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()

      - name: Environment check
        shell: powershell
        run: .\gameshelf.ps1 doctor

      - name: Test suite
        shell: powershell
        run: .\tests\run-tests.ps1

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Environment check
        shell: pwsh
        run: .\gameshelf.ps1 doctor

      - name: Test suite
        shell: pwsh
        run: .\tests\run-tests.ps1
